<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HelpZo — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0F2547; --ink-soft:#3B4A6B; --muted:#6B7280;
    --bg:#F5F7FA; --card:#FFFFFF; --amber:#E8A33D; --amber-ink:#5A3A0B;
    --primary:#1667E8; --primary-dark:#0B3E9E; --primary-bg:#E7EEFD;
    --green:#22B24C; --green-bg:#DCF5E5;
    --line:#EDEFF3; --danger:#E53935; --danger-bg:#FBEAE7; --radius:14px;
    --shadow:0 1px 2px rgba(15,37,71,.06), 0 8px 24px rgba(15,37,71,.06);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;}
  a{color:var(--primary);}
  .hidden{display:none !important;}

  /* login */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
    background:linear-gradient(180deg,#062B7A,#1667E8);}
  .login-card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:28px;width:100%;max-width:360px;}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .brand-mark{width:40px;height:40px;flex-shrink:0;border-radius:10px;background:linear-gradient(180deg,#0B3E9E,#1667E8);display:flex;align-items:center;justify-content:center;padding:5px;}
  .brand-mark img{width:100%;height:100%;object-fit:contain;display:block;}
  .brand-name{font-weight:800;font-size:18px;}
  .brand-name .z{color:var(--green);}
  .sub{color:var(--muted);font-size:13px;margin:6px 0 20px;}
  label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin:12px 0 6px;}
  input{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:14px;font-family:inherit;color:var(--ink);outline:none;background:var(--card);}
  input:focus{border-color:var(--primary);}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:10px;font-family:inherit;font-size:13.5px;font-weight:600;padding:10px 14px;cursor:pointer;color:var(--ink);}
  .btn:hover{border-color:var(--primary);}
  .btn-primary{background:var(--primary);color:#fff;border-color:var(--primary);width:100%;padding:12px;margin-top:18px;}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-sm{padding:6px 10px;font-size:12px;}
  .btn-teal{background:var(--green);color:#fff;border-color:var(--green);}
  .btn-danger{background:var(--danger-bg);color:var(--danger);border-color:var(--danger);}
  .err{color:var(--danger);font-size:12.5px;margin-top:12px;min-height:16px;}

  header.top{background:var(--card);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;}
  header .spacer{flex:1;}
  header .who{font-size:12.5px;color:var(--muted);}
  .tabs{display:flex;gap:4px;padding:10px 16px 0;background:var(--card);border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:57px;z-index:9;}
  .tab{border:none;background:none;font-family:inherit;font-size:13.5px;font-weight:600;color:var(--muted);padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;}
  .tab.active{color:var(--primary);border-bottom-color:var(--primary);}
  main{padding:20px;max-width:1100px;margin:0 auto;}

  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:8px;}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;}
  .stat .n{font-size:26px;font-weight:800;}
  .stat .l{font-size:12px;color:var(--muted);margin-top:2px;}

  .toolbar{display:flex;gap:10px;align-items:center;margin:10px 0 14px;flex-wrap:wrap;}
  .toolbar input{max-width:280px;}
  .count{font-size:12px;color:var(--muted);}

  .table-wrap{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:auto;}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px;}
  th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;background:#F7F9FC;position:sticky;top:0;}
  tbody tr.clickable{cursor:pointer;}
  tbody tr.clickable:hover{background:#F7F9FC;}
  td.num{text-align:right;}
  .pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:9px;}
  .pill.ok{background:var(--green-bg);color:#1B9E3E;}
  .pill.no{background:var(--danger-bg);color:var(--danger);}
  .pill.pending{background:#FBEFDD;color:var(--amber-ink);}
  .pill.blue{background:var(--primary-bg);color:var(--primary);}
  .pill.grey{background:#EEF1F6;color:var(--muted);}
  .empty{padding:30px;text-align:center;color:var(--muted);font-size:13px;}
  .muted{color:var(--muted);}

  .drawer-back{position:fixed;inset:0;background:rgba(15,37,71,.4);z-index:40;display:flex;justify-content:flex-end;}
  .drawer{background:var(--bg);width:min(520px,100%);height:100%;overflow-y:auto;box-shadow:-8px 0 30px rgba(0,0,0,.15);}
  .drawer-head{background:var(--card);border-bottom:1px solid var(--line);padding:16px 18px;display:flex;align-items:center;gap:10px;position:sticky;top:0;}
  .drawer-body{padding:18px;}
  .section{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px;}
  .section h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);}
  .kv{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:5px 0;border-bottom:1px solid var(--line);}
  .kv:last-child{border-bottom:none;}
  .kv b{font-weight:600;}
  .row-actions{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;}
  .avatar{width:44px;height:44px;border-radius:12px;background:var(--primary-bg);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;}
  .doc-item{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;padding:8px 0;border-bottom:1px solid var(--line);}
  .doc-item:last-child{border-bottom:none;}
</style>
</head>
<body>
  <svg style="display:none"><defs>
    <g id="mark">
      <path d="M8 15 L24 4 L40 15" fill="none" stroke="#1667E8" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M11 15 V40 H37 V15" fill="none" stroke="#1667E8" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="20" cy="26" r="6.2" fill="none" stroke="#22B24C" stroke-width="3.2"/>
      <path d="M24 30 L33 39" stroke="#22B24C" stroke-width="3.6" stroke-linecap="round"/>
    </g>
  </defs></svg>

  <!-- LOGIN -->
  <div class="login-wrap" id="loginView">
    <form class="login-card" id="loginForm">
      <div class="brand"><span class="brand-mark"><img src="/logomark.png" alt="HelpZo"></span><div class="brand-name">Help<span class="z">Zo</span> Admin</div></div>
      <p class="sub">Founder / admin access only.</p>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" placeholder="you@helpzo.app" />
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" />
      <button class="btn btn-primary" type="submit" id="loginBtn">Sign in</button>
      <p class="err" id="loginErr"></p>
    </form>
  </div>

  <!-- APP -->
  <div id="appView" class="hidden">
    <header class="top">
      <div class="brand"><span class="brand-mark"><img src="/logomark.png" alt="HelpZo"></span><div class="brand-name">Help<span class="z">Zo</span> Admin</div></div>
      <div class="spacer"></div>
      <span class="who" id="whoami"></span>
      <button class="btn btn-sm" id="refreshBtn">↻ Refresh</button>
      <button class="btn btn-sm" id="logoutBtn">Log out</button>
    </header>
    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="overview">Overview</button>
      <button class="tab" data-tab="customers">Customers</button>
      <button class="tab" data-tab="providers">Providers</button>
      <button class="tab" data-tab="bookings">Bookings</button>
      <button class="tab" data-tab="leads">Leads</button>
      <button class="tab" data-tab="pricing">Pricing</button>
      <button class="tab" data-tab="signups">Signups</button>
      <button class="tab" data-tab="feedback">Feedback</button>
    </nav>
    <main id="content"></main>
  </div>

  <div id="drawerRoot"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
