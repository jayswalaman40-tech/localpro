name: Build Android APKs

# Builds debug APKs for both the customer and provider apps.
# Run it from the Actions tab ("Run workflow"), or it runs automatically on
# pushes to the branches below. Download the APKs from the run's "Artifacts".
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'customer-app/**'
      - 'provider-app/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: customer-app
            artifact: LocalPro-Customer
          - app: provider-app
            artifact: LocalPro-Provider

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: npm install --no-audit --no-fund

      - name: Write .env (Supabase keys)
        working-directory: ${{ matrix.app }}
        run: |
          {
            echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL || 'https://anqikuolwhpcrqnfbaoo.supabase.co' }}"
            echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_cc2LU_CF9qHAQSc44tSjqA_pzMfJ208' }}"
            echo "VITE_DEFAULT_LAT=23.0225"
            echo "VITE_DEFAULT_LNG=72.5714"
          } > .env

      - name: Build web bundle
        working-directory: ${{ matrix.app }}
        run: npm run build

      - name: Add Android platform
        working-directory: ${{ matrix.app }}
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: ${{ matrix.app }}
        run: npx cap sync android

      - name: Build debug APK
        working-directory: ${{ matrix.app }}/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        working-directory: ${{ matrix.app }}
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/${{ matrix.artifact }}-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-apk
          path: ${{ matrix.app }}/out/${{ matrix.artifact }}-debug.apk
          if-no-files-found: error
