name: Build Android APKs

# Builds debug APKs for both the customer and provider apps.
# Run it from the Actions tab ("Run workflow"), or it runs automatically on
# pushes to the branches below. Download the APKs from the run's "Artifacts".
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'customer-app/**'
      - 'provider-app/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: customer-app
            artifact: HelpZo-Customer
          - app: provider-app
            artifact: HelpZo-Provider

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Pin explicit packages — the default includes the obsolete "tools"
          # package which no longer exists and fails the step. Capacitor 6
          # targets Android SDK 34 / build-tools 34.0.0.
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: npm install --no-audit --no-fund

      - name: Write .env (Supabase keys)
        working-directory: ${{ matrix.app }}
        run: |
          {
            echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL || 'https://anqikuolwhpcrqnfbaoo.supabase.co' }}"
            echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_cc2LU_CF9qHAQSc44tSjqA_pzMfJ208' }}"
            echo "VITE_DEFAULT_LAT=23.0225"
            echo "VITE_DEFAULT_LNG=72.5714"
            echo "VITE_GOOGLE_MAPS_API_KEY=${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}"
          } > .env

      - name: Build web bundle
        working-directory: ${{ matrix.app }}
        run: npm run build

      - name: Add Android platform
        working-directory: ${{ matrix.app }}
        run: npx cap add android

      - name: Generate app icon & splash (Helpzo)
        working-directory: ${{ matrix.app }}
        run: npx --yes @capacitor/assets generate --android --splashBackgroundColor '#0B2554' --splashBackgroundColorDark '#0B2554'

      - name: Sync Capacitor
        working-directory: ${{ matrix.app }}
        run: npx cap sync android

      - name: Build debug APK
        working-directory: ${{ matrix.app }}/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        working-directory: ${{ matrix.app }}
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/${{ matrix.artifact }}-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-apk
          path: ${{ matrix.app }}/out/${{ matrix.artifact }}-debug.apk
          if-no-files-found: error

  # Publishes both APKs to a single "apk-latest" release so they can be
  # downloaded directly (one tap, no zip) from the Releases page.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built APKs
        uses: actions/download-artifact@v4
        with:
          pattern: '*-apk'
          merge-multiple: true
          path: apks

      - name: List APKs
        run: ls -la apks

      - name: Publish to "apk-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: HelpZo APKs (latest build)
          body: |
            Latest debug APKs built from the feature branch.
            - HelpZo-Customer-debug.apk
            - HelpZo-Provider-debug.apk
          prerelease: true
          files: apks/*.apk

  # Auto-refresh the public download page (admin-app/public/downloads) with the
  # APKs that were just built, and commit them back to this branch. Vercel then
  # redeploys the admin app, so helpzo-admin.vercel.app/download.html always
  # serves the newest APK with no manual step. The commit touches only
  # admin-app/** (outside this workflow's path filter) and carries [skip ci],
  # so it never re-triggers a build.
  refresh-download-page:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the branch that triggered this run
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download built APKs
        uses: actions/download-artifact@v4
        with:
          pattern: '*-apk'
          merge-multiple: true
          path: apks

      - name: Copy APKs into the admin download page
        run: |
          mkdir -p admin-app/public/downloads
          cp apks/HelpZo-Customer-debug.apk admin-app/public/downloads/HelpZo-Customer.apk
          cp apks/HelpZo-Provider-debug.apk admin-app/public/downloads/HelpZo-Provider.apk

      - name: Commit & push if the APKs changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add admin-app/public/downloads/HelpZo-Customer.apk admin-app/public/downloads/HelpZo-Provider.apk
          if git diff --cached --quiet; then
            echo "APKs unchanged — nothing to publish."
          else
            git commit -m "Auto-refresh hosted APKs (build ${GITHUB_SHA::7}) [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
