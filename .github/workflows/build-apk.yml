name: Build Android APKs

# Builds debug APKs for both the customer and provider apps.
# Run it from the Actions tab ("Run workflow"), or it runs automatically on
# pushes to the branches below. Download the APKs from the run's "Artifacts".
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'customer-app/**'
      - 'provider-app/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: customer-app
            artifact: HelpZo-Customer
          - app: provider-app
            artifact: HelpZo-Provider

    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Pin explicit packages — the default includes the obsolete "tools"
          # package which no longer exists and fails the step. Capacitor 6
          # targets Android SDK 34 / build-tools 34.0.0.
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: npm install --no-audit --no-fund

      - name: Write .env (Supabase keys)
        working-directory: ${{ matrix.app }}
        run: |
          {
            echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL || 'https://anqikuolwhpcrqnfbaoo.supabase.co' }}"
            echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_cc2LU_CF9qHAQSc44tSjqA_pzMfJ208' }}"
            echo "VITE_DEFAULT_LAT=23.0225"
            echo "VITE_DEFAULT_LNG=72.5714"
            echo "VITE_GOOGLE_MAPS_API_KEY=${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}"
          } > .env

      - name: Build web bundle
        working-directory: ${{ matrix.app }}
        run: npm run build

      - name: Add Android platform
        working-directory: ${{ matrix.app }}
        run: npx cap add android

      - name: Generate app icon & splash (Helpzo)
        working-directory: ${{ matrix.app }}
        run: npx --yes @capacitor/assets generate --android --splashBackgroundColor '#0B2554' --splashBackgroundColorDark '#0B2554'

      - name: Sync Capacitor
        working-directory: ${{ matrix.app }}
        run: npx cap sync android

      - name: Build debug APK
        working-directory: ${{ matrix.app }}/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        working-directory: ${{ matrix.app }}
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/${{ matrix.artifact }}-debug.apk"

      # Publish this app's APK straight to the download page and push it back
      # to the branch — no upload-artifact, so the Actions artifact storage
      # quota can never block it. Each matrix job commits only its own file;
      # a rebase-retry loop lets the two parallel jobs (customer + provider)
      # push without conflicting. The commit touches only admin-app/** and
      # carries [skip ci], so it never re-triggers a build.
      - name: Publish APK to the download page
        run: |
          APP="${{ matrix.artifact }}"
          DEST="admin-app/public/downloads/${APP}.apk"
          META="admin-app/public/downloads/${APP}.json"
          mkdir -p admin-app/public/downloads
          cp "${{ matrix.app }}/out/${APP}-debug.apk" "$DEST"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          # Publish when the APK actually changed, or when its metadata file is
          # missing (first run) — avoids no-op commits but always seeds version.
          if git diff --cached --quiet && [ -f "$META" ]; then echo "APK unchanged — nothing to publish."; exit 0; fi
          # Per-app version (distinct per app + per build) and exact build time.
          LETTER=$([ "${{ matrix.app }}" = "customer-app" ] && echo C || echo P)
          BUILT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          VER="1.0.${GITHUB_SHA::7}-${LETTER}"
          SIZE_MB="$(awk "BEGIN{printf \"%.1f\", $(stat -c%s "$DEST")/1048576}")"
          printf '{"version":"%s","built_at":"%s","size_mb":"%s","sha":"%s"}\n' \
            "$VER" "$BUILT" "$SIZE_MB" "${GITHUB_SHA::7}" > "$META"
          git add "$META"
          git commit -m "Auto-refresh ${APP} APK ${VER} (build ${GITHUB_SHA::7}) [skip ci]"
          for i in 1 2 3 4 5 6; do
            if git pull --rebase origin "${{ github.ref_name }}" && git push origin HEAD:"${{ github.ref_name }}"; then
              echo "published"; exit 0
            fi
            echo "push race — retry $i"; sleep $((RANDOM % 6 + 2))
          done
          echo "failed to push APK after retries"; exit 1
