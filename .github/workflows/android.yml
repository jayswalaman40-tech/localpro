name: Build Android APKs

# Builds debug APKs for both apps in the cloud (fast network, reproducible).
# Download them from the run's "Artifacts" once it finishes.
on:
  workflow_dispatch:        # run manually from the Actions tab
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [ customer-app, provider-app ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install web deps + build
        working-directory: ${{ matrix.app }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm install
          npm run build

      - name: Add Android platform + sync
        working-directory: ${{ matrix.app }}
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build debug APK
        working-directory: ${{ matrix.app }}/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-debug-apk
          path: ${{ matrix.app }}/android/app/build/outputs/apk/debug/*.apk

  # Publish both APKs to a rolling "latest" GitHub Release so the download
  # website has stable public URLs:
  #   releases/latest/download/Helpzo-Customer-debug.apk
  #   releases/latest/download/Helpzo-Provider-debug.apk
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename APKs to stable names
        run: |
          mkdir -p out
          cp artifacts/customer-app-debug-apk/*.apk out/Helpzo-Customer-debug.apk
          cp artifacts/provider-app-debug-apk/*.apk out/Helpzo-Provider-debug.apk

      - name: Publish rolling "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Helpzo — latest debug build
          body: |
            Latest debug APKs, rebuilt from `main`.
            - Customer app: Helpzo-Customer-debug.apk
            - Provider app: Helpzo-Provider-debug.apk
          files: out/*.apk
          fail_on_unmatched_files: true
