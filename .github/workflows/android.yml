name: Build Android APKs

# Builds debug APKs for both apps in the cloud (fast network, reproducible).
# Download them from the run's "Artifacts" once it finishes.
on:
  workflow_dispatch:        # run manually from the Actions tab
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [ customer-app, provider-app ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install web deps + build
        working-directory: ${{ matrix.app }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm install
          npm run build

      - name: Add Android platform + sync
        working-directory: ${{ matrix.app }}
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build debug APK
        working-directory: ${{ matrix.app }}/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-debug-apk
          path: ${{ matrix.app }}/android/app/build/outputs/apk/debug/*.apk
