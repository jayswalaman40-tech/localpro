name: Build Android APKs

# Builds debug APKs for both apps and publishes them to a rolling "latest"
# GitHub Release (stable public download URLs). Uploads straight to the
# Release — NOT to Actions artifacts — so it doesn't touch the artifact
# storage quota.
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest ships the Android SDK; just accept the licenses.
      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER=$(ls "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "Using: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

      - name: Build Customer APK
        working-directory: customer-app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm install
          npm run build
          npx cap add android || true
          npx cap sync android
          cd android && chmod +x ./gradlew && ./gradlew assembleDebug --no-daemon

      - name: Build Provider APK
        working-directory: provider-app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm install
          npm run build
          npx cap add android || true
          npx cap sync android
          cd android && chmod +x ./gradlew && ./gradlew assembleDebug --no-daemon

      - name: Collect APKs with stable names
        run: |
          mkdir -p out
          cp customer-app/android/app/build/outputs/apk/debug/*.apk out/Helpzo-Customer-debug.apk
          cp provider-app/android/app/build/outputs/apk/debug/*.apk out/Helpzo-Provider-debug.apk
          ls -lh out

      - name: Publish rolling "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Helpzo — latest debug build
          body: |
            Latest debug APKs, rebuilt automatically.
            - Customer app: Helpzo-Customer-debug.apk
            - Provider app: Helpzo-Provider-debug.apk
          files: out/*.apk
          fail_on_unmatched_files: true
